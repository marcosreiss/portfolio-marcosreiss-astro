# public/admin/config.yml

backend:
  name: turbo-github
  turbo_site_id: "5896c65e-d198-4b81-ba54-99438e565e28"
  branch: main

locale: pt

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projetos"
    label_singular: "Projeto"
    description: "Gerencie os projetos do portfólio."

    folder: "src/content/projects"
    create: true
    extension: "md"
    format: "frontmatter"

    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}} — {{kind}}"

    fields:
      - label: "Título em português"
        name: "title"
        widget: "string"

      - label: "Tipo de projeto"
        name: "kind"
        widget: "select"
        options:
          - { label: "Externo", value: "external" }
          - { label: "Detalhado", value: "detailed" }

      - label: "Apresentação"
        name: "translations"
        widget: "object"
        fields:
          - label: "Português"
            name: "pt"
            widget: "object"
            fields:
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - {
                  label: "Descrição",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Conteúdo detalhado",
                  name: "content",
                  widget: "markdown",
                  required: false,
                }

          - label: "Inglês"
            name: "en"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - {
                  label: "Description",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Detailed content",
                  name: "content",
                  widget: "markdown",
                  required: false,
                }

      - {
          label: "Destaque na home",
          name: "featured",
          widget: "boolean",
          default: false,
        }

      - {
          label: "Publicado",
          name: "published",
          widget: "boolean",
          default: true,
        }

      - label: "Tecnologias"
        name: "stack"
        widget: "list"
        default: []
        field:
          label: "Tecnologia"
          name: "technology"
          widget: "string"

      - label: "Data inicial"
        name: "startDate"
        widget: "string"
        pattern:
          - "^[0-9]{2}-[0-9]{2}-[0-9]{4}$"
          - "Informe a data no formato DD-MM-YYYY (ex.: 15-11-2025)"
        hint: "Formato: DD-MM-YYYY (ex.: 15-11-2025)"

      - label: "Data final"
        name: "endDate"
        widget: "string"
        required: false
        pattern:
          - "^[0-9]{2}-[0-9]{2}-[0-9]{4}$"
          - "Informe a data no formato DD-MM-YYYY (ex.: 20-03-2026)"
        hint: "Formato: DD-MM-YYYY (ex.: 20-03-2026)"

      - label: "Imagens de capa"
        name: "thumb"
        widget: "object"
        fields:
          - {
              label: "Desktop",
              name: "desktop",
              widget: "image",
              required: false,
            }
          - {
              label: "Mobile",
              name: "mobile",
              widget: "image",
              required: false,
            }

      - label: "Links"
        name: "links"
        widget: "object"
        fields:
          - {
              label: "Projeto publicado",
              name: "liveUrl",
              widget: "string",
              required: false,
            }
          - {
              label: "Repositório",
              name: "repoUrl",
              widget: "string",
              required: false,
            }

      - label: "Galeria"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.src}}"
        fields:
          - { label: "Imagem", name: "src", widget: "image" }
          - {
              label: "Texto alternativo",
              name: "alt",
              widget: "string",
              required: false,
            }

      - label: "Vídeo"
        name: "video"
        widget: "object"
        required: false
        fields:
          - {
              label: "URL do vídeo",
              name: "src",
              widget: "string",
              required: false,
            }
          - {
              label: "Imagem de capa",
              name: "poster",
              widget: "image",
              required: false,
            }
