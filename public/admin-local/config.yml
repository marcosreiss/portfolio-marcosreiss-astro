# public/admin-local/config.yml

backend:
  name: git-gateway

local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts:
    - localhost

locale: pt

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projetos"
    label_singular: "Projeto"
    description: "Gerencie os projetos do portfólio."

    folder: "src/content/projects"
    create: true
    extension: "md"
    format: "frontmatter"

    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}} — {{kind}}"

    fields:
      - label: "Título em português"
        name: "title"
        widget: "string"

      - label: "Tipo de projeto"
        name: "kind"
        widget: "select"
        options:
          - { label: "Externo", value: "external" }
          - { label: "Detalhado", value: "detailed" }

      - label: "Apresentação"
        name: "translations"
        widget: "object"
        fields:
          - label: "Português"
            name: "pt"
            widget: "object"
            fields:
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - {
                  label: "Descrição",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Conteúdo detalhado",
                  name: "content",
                  widget: "markdown",
                  required: false,
                }

          - label: "Inglês"
            name: "en"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - {
                  label: "Description",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Detailed content",
                  name: "content",
                  widget: "markdown",
                  required: false,
                }

      - {
          label: "Destaque na home",
          name: "featured",
          widget: "boolean",
          default: false,
        }

      - {
          label: "Publicado",
          name: "published",
          widget: "boolean",
          default: true,
        }

      - label: "Tecnologias"
        name: "stack"
        widget: "list"
        default: []
        field:
          label: "Tecnologia"
          name: "technology"
          widget: "string"

      - label: "Data inicial"
        name: "startDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Data final"
        name: "endDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false

      - label: "Imagens de capa"
        name: "thumb"
        widget: "object"
        fields:
          - {
              label: "Desktop",
              name: "desktop",
              widget: "image",
              required: false,
            }
          - {
              label: "Mobile",
              name: "mobile",
              widget: "image",
              required: false,
            }

      - label: "Links"
        name: "links"
        widget: "object"
        fields:
          - {
              label: "Projeto publicado",
              name: "liveUrl",
              widget: "string",
              required: false,
            }
          - {
              label: "Repositório",
              name: "repoUrl",
              widget: "string",
              required: false,
            }

      - label: "Galeria"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.src}}"
        fields:
          - { label: "Imagem", name: "src", widget: "image" }
          - {
              label: "Texto alternativo",
              name: "alt",
              widget: "string",
              required: false,
            }

      - label: "Vídeo"
        name: "video"
        widget: "object"
        required: false
        fields:
          - {
              label: "URL do vídeo",
              name: "src",
              widget: "string",
              required: false,
            }
          - {
              label: "Imagem de capa",
              name: "poster",
              widget: "image",
              required: false,
            }
